name: Autonomous Original Shorts Publisher

on:
  schedule:
    # Slot 1: US Afternoon Peak (2:00 PM EST / 19:00 UTC)
    - cron: '0 19 * * *'
    # Slot 2: US Evening Prime Time (6:00 PM EST / 23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional custom topic (blank = auto rotating high-retention story)'
        required: false
        default: ''
  push:
    branches:
      - trigger-us-upload

jobs:
  publish-original-short:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Bold Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render & Publish Original Short (US Server)
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON || secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOPIC="${{ github.event.inputs.topic || '' }}"
          python run_pipeline.py --topic "$TOPIC"
