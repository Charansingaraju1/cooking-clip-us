name: Viral Pipeline - 3-Slot Autonomous Publisher

on:
  schedule:
    # Slot 1: US Morning Commute (8:00 AM EST / 13:00 UTC)
    - cron: '0 13 * * *'
    # Slot 2: US Lunch Rush (12:00 PM EST / 17:00 UTC)
    - cron: '0 17 * * *'
    # Slot 3: US Evening Prime Time (7:00 PM EST / 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Streamer Channel (kaicenat, lacy, ishowspeed)'
        required: true
        default: 'kaicenat'
      url:
        description: 'Direct VOD or Stream URL (optional)'
        required: false
        default: ''
      hook:
        description: '3-Second Hook Text Overlay (optional)'
        required: false
        default: ''

jobs:
  publish-viral-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Clipping & Publishing Pipeline
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'kaicenat' }}"
          URL="${{ github.event.inputs.url || '' }}"
          HOOK="${{ github.event.inputs.hook || '' }}"
          python run_pipeline.py --channel "$CHANNEL" --url "$URL" --hook "$HOOK"
