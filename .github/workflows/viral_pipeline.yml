name: Viral Pipeline - 2-Slot High Retention Publisher

on:
  schedule:
    # Slot 1: US Afternoon Peak (2:00 PM EST / 19:00 UTC)
    - cron: '0 19 * * *'
    # Slot 2: US Evening Prime Time (6:00 PM EST / 23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches:
      - trigger-us-upload
    inputs:
      channel:
        description: 'Streamer Channel (kaicenat, lacy, ishowspeed)'
        required: true
        default: 'kaicenat'
      url:
        description: 'Direct VOD or Stream URL (optional)'
        required: false
        default: ''
      hook:
        description: '3-Second Hook Text Overlay (optional)'
        required: false
        default: ''

jobs:
  publish-viral-short:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Clipping & Publishing Pipeline
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON || secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'auto' }}"
          URL="${{ github.event.inputs.url || '' }}"
          HOOK="${{ github.event.inputs.hook || '' }}"
          python run_pipeline.py --channel "$CHANNEL" --url "$URL" --hook "$HOOK"
